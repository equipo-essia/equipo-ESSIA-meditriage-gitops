apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meditriage-prod
resources:
  - ../../base
images:
  - name: ghcr.io/guffy0921/meditriage
    digest: sha256:11a9c511d4ea3351a32c286e1031c35da57a313d298db8dec4091022977e8971
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: meditriage-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
